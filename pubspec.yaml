name: alo_simple
description: Private offline Persian voice personal finance for iOS and Android.
publish_to: none
version: 2.4.2+7
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  sherpa_onnx: 1.13.8
  audioplayers: ^6.5.1
  record: ^6.1.2
  file_picker: ^10.3.8
  whisper_ggml: 2.6.0
  shamsi_date: ^1.0.4
  uuid: ^4.5.1
  archive: ^4.0.7
  crypto: ^3.0.6
  unorm_dart: ^0.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/model_manifest.json
    - assets/models/
    - assets/tts/
    - assets/vad/
    - assets/licenses/
    - assets/tts/espeak-ng-data/
    - assets/tts/espeak-ng-data/lang/
    - assets/tts/espeak-ng-data/lang/aav/
    - assets/tts/espeak-ng-data/lang/art/
    - assets/tts/espeak-ng-data/lang/azc/
    - assets/tts/espeak-ng-data/lang/bat/
    - assets/tts/espeak-ng-data/lang/bnt/
    - assets/tts/espeak-ng-data/lang/ccs/
    - assets/tts/espeak-ng-data/lang/cel/
    - assets/tts/espeak-ng-data/lang/cus/
    - assets/tts/espeak-ng-data/lang/dra/
    - assets/tts/espeak-ng-data/lang/esx/
    - assets/tts/espeak-ng-data/lang/gmq/
    - assets/tts/espeak-ng-data/lang/gmw/
    - assets/tts/espeak-ng-data/lang/grk/
    - assets/tts/espeak-ng-data/lang/inc/
    - assets/tts/espeak-ng-data/lang/ine/
    - assets/tts/espeak-ng-data/lang/ira/
    - assets/tts/espeak-ng-data/lang/iro/
    - assets/tts/espeak-ng-data/lang/itc/
    - assets/tts/espeak-ng-data/lang/jpx/
    - assets/tts/espeak-ng-data/lang/map/
    - assets/tts/espeak-ng-data/lang/miz/
    - assets/tts/espeak-ng-data/lang/myn/
    - assets/tts/espeak-ng-data/lang/poz/
    - assets/tts/espeak-ng-data/lang/roa/
    - assets/tts/espeak-ng-data/lang/sai/
    - assets/tts/espeak-ng-data/lang/sem/
    - assets/tts/espeak-ng-data/lang/sit/
    - assets/tts/espeak-ng-data/lang/tai/
    - assets/tts/espeak-ng-data/lang/trk/
    - assets/tts/espeak-ng-data/lang/urj/
    - assets/tts/espeak-ng-data/lang/zle/
    - assets/tts/espeak-ng-data/lang/zls/
    - assets/tts/espeak-ng-data/lang/zlw/
    - assets/tts/espeak-ng-data/voices/
    - assets/tts/espeak-ng-data/voices/!v/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf

dependency_overrides:
  whisper_ggml:
    path: packages/whisper_ggml
